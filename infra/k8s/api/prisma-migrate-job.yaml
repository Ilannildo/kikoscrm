apiVersion: batch/v1
kind: Job
metadata:
  name: kikos-prisma-migrate
  namespace: kikos
spec:
  backoffLimit: 0

  template:
    metadata:
      labels:
        app: kikos-prisma-migrate

    spec:
      restartPolicy: Never

      imagePullSecrets:
        - name: regcred

      containers:
        - name: prisma-migrate
          image: ghcr.io/ilannildo/kikos-api:latest
          imagePullPolicy: Always

          workingDir: /app/apps/api

          command:
            - pnpm
          args:
            - exec
            - prisma
            - migrate
            - deploy

          envFrom:
            - configMapRef:
                name: kikos-api-config
            - secretRef:
                name: kikos-api-secrets
