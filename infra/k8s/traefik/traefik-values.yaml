deployment:
  replicas: 1

ports:
  web:
    port: 80    
    exposedPort: 80
  websecure:
    port: 443    
    exposedPort: 443

providers:
  kubernetesGateway:
    enabled: true
  kubernetesCRD:
    enabled: true  

gatewayClass:
  enabled: false

gateway:
  enabled: false 

ingressRoute:
  dashboard:
    enabled: true

service:
  type: LoadBalancer