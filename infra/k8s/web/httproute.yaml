apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kikos-web
  namespace: kikos
spec:
  parentRefs:
    - name: main-gateway
      namespace: default      
  hostnames:
    - app.kikos.teragestor.com.br      
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kikos-web          
          port: 3000
